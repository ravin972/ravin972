<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 490 360" width="100%" height="100%">
  <style>
    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(-10px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .fade-row {
      opacity: 0;
      animation: slideIn 0.35s ease-out forwards;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .title { font-weight: bold; fill: #58a6ff; }
    .separator { fill: #8b949e; }
    .label { font-weight: 600; }
    .value { fill: #c9d1d9; }
  </style>

  <rect width="100%" height="100%" fill="#0d1117" rx="8" stroke="#30363d" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="25" cy="22" r="5" fill="#ff5f56" />
  <circle cx="42" cy="22" r="5" fill="#ffbd2e" />
  <circle cx="59" cy="22" r="5" fill="#27c93f" />

  <!-- Title bar -->
  <text x="80" y="26" class="title">ravin@github</text>
  <line x1="20" y1="42" x2="470" y2="42" stroke="#21262d" stroke-width="1" />

  <!-- Info lines -->
  
    <g class="fade-row" style="animation-delay: 0.15s;">
      <text x="25" y="80" class="label" fill="#58a6ff">Role</text>
      <text x="110" y="80" class="separator">~</text>
      <text x="130" y="80" class="value">Backend Developer &amp; AI Integrator</text>
    </g>
    <g class="fade-row" style="animation-delay: 0.23s;">
      <text x="25" y="110" class="label" fill="#7ee787">Stack</text>
      <text x="110" y="110" class="separator">~</text>
      <text x="130" y="110" class="value">Python, FastAPI, Node.js, PostgreSQL, React</text>
    </g>
    <g class="fade-row" style="animation-delay: 0.31s;">
      <text x="25" y="140" class="label" fill="#ffa657">Cloud/Ops</text>
      <text x="110" y="140" class="separator">~</text>
      <text x="130" y="140" class="value">Docker, Redis, Supabase, Linux</text>
    </g>
    <g class="fade-row" style="animation-delay: 0.39s;">
      <text x="25" y="170" class="label" fill="#d2a8ff">Building</text>
      <text x="110" y="170" class="separator">~</text>
      <text x="130" y="170" class="value">Voxly (OSS Webhook &amp; Messaging Engine)</text>
    </g>
    <g class="fade-row" style="animation-delay: 0.47s;">
      <text x="25" y="200" class="label" fill="#79c0ff">Focus</text>
      <text x="110" y="200" class="separator">~</text>
      <text x="130" y="200" class="value">High-performance APIs &amp; AI Agent Orchestration</text>
    </g>
    <g class="fade-row" style="animation-delay: 0.55s;">
      <text x="25" y="230" class="label" fill="#ff7b72">Location</text>
      <text x="110" y="230" class="separator">~</text>
      <text x="130" y="230" class="value">India</text>
    </g>

  <!-- Terminal Color Blocks -->
  <g class="fade-row" style="animation-delay: 0.73s;">
    <rect x="25" y="278" width="18" height="12" rx="2" fill="#484f58" /><rect x="49" y="278" width="18" height="12" rx="2" fill="#ff7b72" /><rect x="73" y="278" width="18" height="12" rx="2" fill="#7ee787" /><rect x="97" y="278" width="18" height="12" rx="2" fill="#d29922" /><rect x="121" y="278" width="18" height="12" rx="2" fill="#58a6ff" /><rect x="145" y="278" width="18" height="12" rx="2" fill="#bc8cff" /><rect x="169" y="278" width="18" height="12" rx="2" fill="#39c5cf" /><rect x="193" y="278" width="18" height="12" rx="2" fill="#f0f6fc" />
  </g>
</svg>